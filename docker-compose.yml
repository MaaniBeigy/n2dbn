# Services for the N2DBN benchmark.
#
#   docker compose run --rm tests            full suite with coverage
#   docker compose run --rm exp1             one experiment on the full grid
#   docker compose run --rm shell            interactive session
#   docker compose run --rm gpu-info         what the GPU service can see
#   docker compose run --rm exp5-gpu         algorithm comparison on the GPU
#
# `results/` and `paper/` are bind-mounted, so an interrupted run keeps the rows
# it finished and a rebuilt image never loses an output.
#
# JOBS sets how many (scenario, replicate) pairs are fitted at once.  Every
# worker holds its own copy of the dataset, so the ceiling is memory rather than
# cores; `python -m src.utils.resources` prints what this machine allows.

x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile.cpu
    args:
      GIT_REV: ${GIT_REV:-unknown}
  image: n2dbn:cpu
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace
    PYTHONHASHSEED: "0"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    MPLBACKEND: Agg
  volumes:
    - ./results:/workspace/results
    - ./paper:/workspace/paper
  shm_size: "2gb"

x-gpu: &gpu
  build:
    context: .
    dockerfile: docker/Dockerfile.gpu
    args:
      GIT_REV: ${GIT_REV:-unknown}
  image: n2dbn:gpu
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace
    PYTHONHASHSEED: "0"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    MPLBACKEND: Agg
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - ./results:/workspace/results
    - ./paper:/workspace/paper
  shm_size: "2gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ---------------------------------------------------------------- CPU ----
  # The three development services mount the working tree over the copy baked
  # into the image, so an edit takes effect without a rebuild.  The experiment
  # services deliberately do not, so a published run is reproducible from its
  # image rather than from whatever the tree happened to hold.
  tests:
    <<: *common
    volumes:
      - .:/workspace
      - ./results:/workspace/results
    command: >-
      python -m pytest tests/ -q --cov=src --cov-report=term-missing
      --cov-report=xml:results/coverage.xml

  lint:
    <<: *common
    volumes:
      - .:/workspace
    command: >-
      sh -c "python -m isort --check-only src experiments tests conftest.py &&
             python -m black --check src experiments tests conftest.py"

  # The container runs as root, so a rewritten file lands owned by root and the
  # host user can no longer edit it.  The ownership of a file the service does
  # not touch says who to give the rewritten ones back to.
  format:
    <<: *common
    volumes:
      - .:/workspace
    command: >-
      sh -c "python -m isort src experiments tests conftest.py &&
             python -m black src experiments tests conftest.py &&
             chown -R $$(stat -c '%u:%g' /workspace/pyproject.toml) /workspace/src /workspace/experiments /workspace/tests /workspace/conftest.py"

  shell:
    <<: *common
    volumes:
      - .:/workspace
    command: bash
    stdin_open: true
    tty: true

  cpu-info:
    <<: *common
    command: python -m src.utils.resources

  exp1:
    <<: *common
    command: >-
      python -m experiments.exp1_ideal_recovery
      --jobs ${JOBS:-4} --output-dir results/exp1

  exp2:
    <<: *common
    command: >-
      python -m experiments.exp2_hierarchy_benefit
      --jobs ${JOBS:-4} --output-dir results/exp2

  exp3:
    <<: *common
    command: >-
      python -m experiments.exp3_ablation
      --jobs ${JOBS:-4} --output-dir results/exp3

  exp4:
    <<: *common
    command: >-
      python -m experiments.exp4_misspecification
      --jobs ${JOBS:-4} --output-dir results/exp4

  # ALGORITHMS names a subset of the published learners, and the three sorting
  # baselines are requested by name.  OUT keeps such an arm off the stored run:
  #   ALGORITHMS=var-sortnregress,r2-sortnregress,random-sortnregress \
  #     OUT=exp5_sortnregress docker compose run --rm exp5
  exp5:
    <<: *common
    command: >-
      python -m experiments.exp5_algorithm_comparison
      --jobs ${JOBS:-4} --algorithms ${ALGORITHMS:-default}
      --output-dir results/${OUT:-exp5}

  # Fit from an observed event log CSV rather than from a generated scenario.
  # CSV names the file under the mounted data directory, BRANCHING the ladder
  # it is laid on, and MANIFEST an optional declared manifest beside it, which
  # turns the structural section on:
  #   CSV=data/dynamic_patterns/event_log.tsv \
  #   MANIFEST=data/dynamic_patterns/manifest_declared.json \
  #   BRANCHING=60,24,7 docker compose run --rm exp6
  exp6:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp6_real_log
      --csv ${CSV:-data/events.csv} --manifest "${MANIFEST:-}"
      --branching ${BRANCHING:-10,6} --output-dir results/exp6

  # Do the learned conditional distributions match the ones that generated the
  # data.  Structure recovery alone cannot answer that.
  exp7:
    <<: *common
    command: >-
      python -m experiments.exp7_parameter_recovery
      --output-dir results/exp7

  # External ground truth: a bnlearn network tiled into a 2TBN, whose exact
  # conditional probability tables pgmpy vendors inside the wheel.
  exp8:
    <<: *common
    command: >-
      python -m experiments.exp8_bnlearn_tiling
      --output-dir results/exp8

  # What pooling buys: one graph fitted over a roster, on two arms over one
  # cross, scored against the declared manifest and against the pre-registered
  # sufficiency ledger.  SUBJECT_ARM sweeps the roster at a fixed horizon and
  # HORIZON_ARM sweeps the weeks at the largest roster.  DRY_RUN prints the
  # cells, the subject-week total and the estimated wall clock without fitting:
  #   DRY_RUN=--dry-run docker compose run --rm exp11
  # The smallest sweep that still answers the question:
  #   SUBJECT_ARM=1,6,12,24,30 HORIZON_ARM=4,8 ITERS=4 \
  #     docker compose run --rm exp11
  exp11:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp11_pooling
      --csv ${CSV:-data/dynamic_patterns/event_log.tsv}
      --manifest ${MANIFEST:-data/dynamic_patterns/manifest_declared.json}
      --subject-arm ${SUBJECT_ARM:-1,3,6,12,18,24,30}
      --horizon-arm ${HORIZON_ARM:-2,4,6,8,12}
      --weeks ${WEEKS:-12} --iters ${ITERS:-4} --workers ${JOBS:-4}
      ${DRY_RUN:-} --output-dir results/exp11

  # Published structure learners on the day scale of the benchmark, scored
  # against its declared manifest.  ALGORITHMS names a subset, `all` adds the
  # three learners that search the full node set and run for hours here:
  #   ALGORITHMS=hc-bic,granger docker compose run --rm exp13
  exp13:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp13_classical_on_benchmark
      --csv ${CSV:-data/dynamic_patterns/event_log.tsv}
      --manifest ${MANIFEST:-data/dynamic_patterns/manifest_declared.json}
      --algorithms ${ALGORITHMS:-default}
      --max-lag ${MAX_LAG:-2} --max-indegree ${MAX_INDEGREE:-2}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp13

  # Whether the record holds enough epochs to answer at all, on the observed
  # log and on a copy of it clipped short enough to fail the screen.
  exp10:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp10_sufficiency_ledger
      --csv ${CSV:-data/events.csv}
      --branching ${BRANCHING:-10,6} --max-lag ${MAX_LAG:-2}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp10

  # Posterior predictive fidelity: fit a roster, generate replicate logs and
  # score the two against each other.  QUICK=--quick runs two subjects over
  # five replicates and two weeks, which is what continuous integration runs.
  exp12:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp12_fidelity
      --csv ${CSV:-data/dynamic_patterns/event_log.tsv}
      --subjects ${SUBJECTS:-8} --replicates ${REPLICATES:-80}
      --weeks ${WEEKS:-12} --workers ${JOBS:-8}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp12

  # The observational arm's data path: the collapse, the ladder on participant
  # time, the gap audit, the frozen anchors, the coarse ordering and the shift
  # placebo.  Nothing here needs a fit.
  exp14:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp14_arm1_lifesnaps
      --participants ${PARTICIPANTS:-51}
      --merge ${MERGE:-max}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp14

  # The observational arm's fit and the battery it has to survive: the search
  # over the balanced panel, then R1, R2, R3, R4, R7, R9 and R10, then the
  # three-way calendar ablation.
  exp15:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp15_arm1_fit
      --pairs ${PAIRS:-8}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp15

  # The fit-then-simulate round trip: three legs drawn from the arm 1 fit,
  # written as raw logs, read back through the panel reader and put to the
  # nonstationarity grid with the four declared negative controls.
  exp16:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp16_round_trip
      --replicates ${REPLICATES:-5}
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp16

  # What fitting one granularity at a time costs in coherence: each scale's own
  # prediction, summed over a block, against the prediction of the scale above.
  exp17:
    <<: *common
    volumes:
      - ./results:/workspace/results
    command: >-
      python -m experiments.exp17_coherence_gap
      --replicates ${REPLICATES:-3}
      ${QUICK:-}
      --output-dir results/exp17

  # Forecasting published application traffic on a nested ladder, against two of
  # QuitoBench's own deep forecasters fitted one resolution at a time.  SPLIT
  # defaults to the benchmark's declared cutoff, which is the arm that may be
  # set beside a published number.  SPLIT=extended trains on 39 days and holds
  # out the last two, which reads epochs the published protocol assigns to its
  # test block, so it is comparable between arms and to no published number.
  # The parquet splits are not redistributed here, so data/quito/ has to hold
  # `test_min.parquet` and `test_hour.parquet` before this runs.
  exp19:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      python -m experiments.exp19_quito_forecast
      --split ${SPLIT:-cutoff} --limit ${LIMIT:-40}
      --device ${DEVICE:-cpu}
      ${QUICK:-}
      --output-dir results/exp19

  # What limits structure recovery: block length, penalty, stability.  The
  # search table is closed; see the module docstring for the measurement.
  exp9:
    <<: *common
    command: >-
      python -m experiments.exp9_selection_and_search
      ${QUICK:-} ${BUDGET:-}
      --output-dir results/exp9

  exp-all:
    <<: *common
    command: >-
      sh -c "python -m experiments.exp1_ideal_recovery    --jobs ${JOBS:-4} --output-dir results/exp1 &&
             python -m experiments.exp2_hierarchy_benefit --jobs ${JOBS:-4} --output-dir results/exp2 &&
             python -m experiments.exp3_ablation          --jobs ${JOBS:-4} --output-dir results/exp3 &&
             python -m experiments.exp4_misspecification  --jobs ${JOBS:-4} --output-dir results/exp4 &&
             python -m experiments.exp5_algorithm_comparison --jobs ${JOBS:-4} --output-dir results/exp5 &&
             python -m experiments.exp7_parameter_recovery   --output-dir results/exp7 &&
             python -m experiments.exp8_bnlearn_tiling       --output-dir results/exp8"

  # The quick grid of every experiment that declares a budget.  This is what
  # continuous integration runs, so a change that breaks an experiment fails
  # here in minutes.  A published run would take hours to reach the same break.
  exp-quick:
    <<: *common
    volumes:
      - ./results:/workspace/results
      - ./data:/workspace/data:ro
    command: >-
      sh -c "python -m experiments.exp9_selection_and_search  --quick --output-dir results/quick/exp9 &&
             python -m experiments.exp10_sufficiency_ledger   --quick --output-dir results/quick/exp10 &&
             python -m experiments.exp12_fidelity             --quick --output-dir results/quick/exp12 &&
             python -m experiments.exp13_classical_on_benchmark --quick --algorithms ${ALGORITHMS:-empty,tree} --max-lag 1 --output-dir results/quick/exp13 &&
             python -m experiments.exp14_arm1_lifesnaps      --quick --output-dir results/quick/exp14 &&
             python -m experiments.exp15_arm1_fit            --quick --output-dir results/quick/exp15 &&
             python -m experiments.exp16_round_trip          --quick --output-dir results/quick/exp16"

  # Re-render the figures of a finished experiment from its stored results,
  # without refitting: EXP names the results directory under results/.
  plots:
    <<: *common
    command: >-
      python -c "from src.utils.temporal_viz import experiment_plots;
      import os; exp = os.environ.get('EXP', 'exp1');
      paths = experiment_plots(f'results/{exp}/{exp}_results.json',
      f'results/{exp}/plots');
      print('\n'.join(paths))"
    environment:
      PYTHONPATH: /workspace
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      EXP: ${EXP:-exp1}

  # --------------------------------------------------------- LIFESNAPS ----
  # The observed log is derived from the published LifeSnaps MongoDB dump, and
  # the derived CSV is not redistributed here.  Two services rebuild it:
  #   docker compose run --rm lifesnaps-restore   fetch the dump, load mongo
  #   docker compose run --rm lifesnaps-build     write the event log
  # The restore needs about 12 GiB under the `lifesnaps` volume and runs once.
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  lifesnaps-restore:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo:27017
      MONGO_DB: rais_anonymized
      FORCE: ${FORCE:-}
    volumes:
      - ./docker/lifesnaps_restore.sh:/restore.sh:ro
      - lifesnaps:/data/lifesnaps
    entrypoint: ["sh", "/restore.sh"]

  lifesnaps-build:
    <<: *common
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
      MONGO_URI: mongodb://mongo:27017/
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src:ro
    command: >-
      python -m src.lifesnaps.event_log
      --roster src/lifesnaps/roster.txt
      --output ${OUTPUT:-data/observed_lifesnaps_event_log.csv}

  # ------------------------------------------------------------- PAPER ----
  paper:
    build:
      context: .
      dockerfile: docker/Dockerfile.paper
    image: n2dbn:paper
    working_dir: /workspace/paper
    volumes:
      - ./paper:/workspace/paper
    command: >-
      latexmk -pdf -interaction=nonstopmode ${TEX:-n2dbn.tex}

  # The submission carries its own class file, figure and bibliography beside
  # it and names all three without a path, so latexmk has to run with that
  # directory as its working directory.  The TEX variable above cannot supply
  # one, which is why this is its own service.
  paper-wsdm:
    build:
      context: .
      dockerfile: docker/Dockerfile.paper
    image: n2dbn:paper
    working_dir: /workspace/paper/WSDM
    volumes:
      - ./paper:/workspace/paper
    command: >-
      latexmk -pdf -interaction=nonstopmode sigconf.tex

  # ---------------------------------------------------------------- GPU ----
  gpu-info:
    <<: *gpu
    command: python -m src.utils.resources

  gpu-tests:
    <<: *gpu
    volumes:
      - .:/workspace
      - ./results:/workspace/results
    command: >-
      python -m pytest tests/ -q --cov=src --cov-report=term-missing

  exp5-gpu:
    <<: *gpu
    command: >-
      python -m experiments.exp5_algorithm_comparison
      --jobs ${JOBS:-4} --device cuda --output-dir results/exp5_gpu

  gpu-shell:
    <<: *gpu
    volumes:
      - .:/workspace
    command: bash
    stdin_open: true
    tty: true

volumes:
  mongo-data:
  lifesnaps:
