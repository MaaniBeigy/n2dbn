# Paper experiments use the source in the built image and read host data.
# Rebuild once after a source change with docker compose build tests.
x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile.cpu
    args:
      GIT_REV: ${GIT_REV:-unknown}
  image: n2dbn:cpu
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace
    PYTHONHASHSEED: "0"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    MPLBACKEND: Agg
  volumes:
    - ./results/paper:/workspace/results/paper
    - ./paper:/workspace/paper
  shm_size: "2gb"

x-data: &data
  <<: *common
  volumes:
    - ./results/paper:/workspace/results/paper
    - ./data:/workspace/data:ro

services:
  tests:
    <<: *common
    volumes:
      - .:/workspace
      - ./results:/workspace/results
    command: >-
      python -m pytest tests/ -q --cov=src --cov-report=term-missing
      --cov-report=xml:results/coverage.xml

  lint:
    <<: *common
    volumes:
      - .:/workspace
    command: >-
      sh -c "python -m isort --check-only src experiments tests conftest.py &&
             python -m black --check src experiments tests conftest.py"

  # The container runs as root, so a rewritten file lands owned by root and the
  # host user can no longer edit it.  The ownership of a file the service does
  # not touch says who to give the rewritten ones back to.
  format:
    <<: *common
    volumes:
      - .:/workspace
    command: >-
      sh -c "python -m isort src experiments tests conftest.py &&
             python -m black src experiments tests conftest.py &&
             chown -R $$(stat -c '%u:%g' /workspace/pyproject.toml) /workspace/src /workspace/experiments /workspace/tests /workspace/conftest.py"

  shell:
    <<: *common
    volumes:
      - .:/workspace
    command: bash
    stdin_open: true
    tty: true

  cpu-info:
    <<: *common
    command: python -m src.utils.resources

  synthetic-structure-recovery:
    <<: *common
    command: >-
      python -m experiments.exp5_algorithm_comparison --jobs ${JOBS:-4}
      --output-dir results/paper/synthetic-structure-recovery

  ordering-baselines:
    <<: *common
    command: >-
      python -m experiments.exp5_algorithm_comparison --jobs ${JOBS:-4}
      --algorithms var-sortnregress,r2-sortnregress,random-sortnregress
      --output-dir results/paper/ordering-baselines

  benchmark-sortability:
    <<: *common
    command: >-
      python -m experiments.exp9_selection_and_search --sortability-only
      --output-dir results/paper/benchmark-sortability

  latent-matched-recovery:
    <<: *common
    command: >-
      python -m experiments.latent_matched_recovery --jobs ${JOBS:-4}
      --output-dir results/paper/latent-matched-recovery

  calendarbench-log-fidelity:
    <<: *data
    command: >-
      python -m experiments.exp12_fidelity --csv data/dynamic_patterns/event_log.tsv
      --subjects 8 --replicates 64 --weeks 12 --workers ${JOBS:-4}
      --budget-seconds ${BUDGET_SECONDS:-86400} --output-dir results/paper/calendarbench-log-fidelity

  cross-resolution-coherence:
    <<: *common
    command: >-
      python -m experiments.exp17_coherence_gap --replicates 3
      --output-dir results/paper/cross-resolution-coherence

  calendarbench-pooled-recovery:
    <<: *data
    command: >-
      python -m experiments.exp11_pooling
      --subject-arm 1,2,3,4,5,6,8,10,12,15,18,20,24,27,30 --horizon-arm ""
      --weeks 12 --iters 4 --workers ${JOBS:-4}
      --output-dir results/paper/calendarbench-pooled-recovery

  calendarbench-structure-baselines:
    <<: *data
    command: >-
      python -m experiments.exp13_classical_on_benchmark --max-lag 2 --max-indegree 2
      --algorithms hc-bic,exhaustive,hc-aic,granger,hc-bdeu,hc-k2,dynotears,tree
      --budget-seconds ${BUDGET_SECONDS:-86400} --output-dir results/paper/calendarbench-structure-baselines

  quito-traffic-forecast:
    <<: *data
    command: >-
      python -m experiments.exp19_quito_forecast --panel min --split ${SPLIT:-cutoff}
      --limit ${LIMIT:-40} --device cpu --horizon-blocks 2 --score-units 6
      --output-dir results/paper/quito-traffic-forecast

  bpic2017-workflow-forecast:
    <<: *data
    command: >-
      python -m experiments.bpic2017_workflow_forecast
      --input data/bpic2017/workflow.xes.gz
      --output-dir results/paper/bpic2017-workflow-forecast

  quito-forecast-reconciliation:
    <<: *data
    command: >-
      python -m experiments.exp19_quito_forecast --compare-reconciliation
      --panel min --split ${SPLIT:-cutoff} --limit ${LIMIT:-40} --device cpu
      --horizon-blocks 2 --score-units 6 --output-dir results/paper/quito-forecast-reconciliation

  lifesnaps-observation-audit:
    <<: *data
    command: >-
      python -m experiments.lifesnaps_observation_audit
      --output-dir results/paper/lifesnaps-observation-audit

  lifesnaps-preparation:
    <<: *data
    command: >-
      python -m experiments.exp14_arm1_lifesnaps --participants 51 --merge max
      --output-dir results/paper/lifesnaps-preparation

  lifesnaps-graph-stability:
    <<: *data
    command: >-
      python -m experiments.exp15_arm1_fit --pairs 8 --budget-seconds ${BUDGET_SECONDS:-86400}
      --output-dir results/paper/lifesnaps-graph-stability

  lifesnaps-log-fidelity:
    <<: *data
    command: >-
      python -m experiments.exp16_round_trip --replicates 5 --budget-seconds ${BUDGET_SECONDS:-86400}
      --output-dir results/paper/lifesnaps-log-fidelity

  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  lifesnaps-restore:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo:27017
      MONGO_DB: rais_anonymized
      FORCE: ${FORCE:-}
    volumes:
      - ./docker/lifesnaps_restore.sh:/restore.sh:ro
      - lifesnaps:/data/lifesnaps
    entrypoint: ["sh", "/restore.sh"]

  lifesnaps-build:
    <<: *common
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
      MONGO_URI: mongodb://mongo:27017/
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src:ro
    command: >-
      python -m src.lifesnaps.event_log
      --roster src/lifesnaps/roster.txt
      --output ${OUTPUT:-data/observed_lifesnaps_event_log.csv}

  # ------------------------------------------------------------- PAPER ----
  # The submission carries its own class file, figure and bibliography beside
  # it and names all three without a path, so latexmk runs with that directory
  # as its working directory.
  paper:
    build:
      context: .
      dockerfile: docker/Dockerfile.paper
    image: n2dbn:paper
    working_dir: /workspace/paper/WSDM
    volumes:
      - ./paper:/workspace/paper
    command: >-
      latexmk -pdf -interaction=nonstopmode sigconf.tex


volumes:
  mongo-data:
  lifesnaps:
